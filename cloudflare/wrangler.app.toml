name = "aooi-app-template"
main = "workers/app.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

[assets]
binding = "ASSETS"
directory = "../dist/client"

[images]
binding = "IMAGES"

[observability]
enabled = true

[vars]
DEPLOY_TARGET = "cloudflare"
